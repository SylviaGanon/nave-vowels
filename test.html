<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>מבחן התנועות - נווה</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Rubik:wght@500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Rubik', sans-serif; background: #f0f9ff; padding: 15px; color: #0f172a; display: flex; flex-direction: column; align-items: center; }
        .back-nav { width: 100%; max-width: 500px; margin-bottom: 10px; }
        .back-btn { text-decoration: none; color: #0284c7; font-weight: 700; }
        .level-row { display: flex; gap: 6px; width: 100%; max-width: 500px; margin-bottom: 15px; }
        .lvl-btn { flex: 1; padding: 8px 4px; border: 2px solid #bae6fd; background: white; border-radius: 10px; font-weight: 700; color: #0369a1; cursor: pointer; font-size: 0.85rem; }
        .lvl-btn.active { background: #0284c7; color: white; border-color: #0284c7; }
        .quiz-card { background: white; border-radius: 20px; padding: 20px; width: 100%; max-width: 500px; border: 2px solid #cbd5e1; text-align: center; box-shadow: 0 6px 15px rgba(0,0,0,0.05); }
        .prompt-text { font-size: 1.4rem; font-weight: 700; color: #0284c7; margin-bottom: 15px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; }
        .opt-btn { background: #f8fafc; border: 2px solid #cbd5e1; border-radius: 12px; padding: 14px; font-family: 'Fredoka', sans-serif; font-size: 1.3rem; font-weight: 700; cursor: pointer; }
        .opt-btn.correct { background: #dcfce7 !important; border-color: #22c55e !important; color: #15803d !important; }
        .opt-btn.wrong { background: #fee2e2 !important; border-color: #ef4444 !important; color: #b91c1c !important; }
        .input-box { width: 80%; padding: 10px; font-size: 1.2rem; font-weight: 700; text-align: center; border: 2px solid #0284c7; border-radius: 10px; margin-bottom: 10px; direction: ltr; }
        .paper-card { background: #fffbeb; border: 2px dashed #f59e0b; padding: 15px; border-radius: 14px; margin-bottom: 15px; }
        .line-guide { font-family: 'Fredoka', sans-serif; font-size: 2.5rem; color: #d97706; text-decoration: underline; letter-spacing: 2px; }
        .action-btn { background: #10b981; color: white; border: none; padding: 10px 20px; border-radius: 10px; font-weight: 700; cursor: pointer; font-size: 1rem; }
    </style>
</head>
<body>
    <div class="back-nav"><a href="index.html" class="back-btn">➡️ חזרה למרכז</a></div>
    <div class="level-row">
        <button class="lvl-btn active" onclick="setLevel(1)">שלב 1: אמריקאי</button>
        <button class="lvl-btn" onclick="setLevel(2)">שלב 2: הקלדה</button>
        <button class="lvl-btn" onclick="setLevel(3)">שלב 3: כתיבה במחברת ✏️</button>
    </div>

    <div class="quiz-card" id="quizCard"></div>

    <script>
        let currentLvl = 1;
        const questions = [
            { prompt: '🐱 c _ t (חתול)', answer: 'a' },
            { prompt: '🖊️ p _ n (עט)', answer: 'e' },
            { prompt: '🐷 p _ g (חזיר)', answer: 'i' },
            { prompt: '🐶 d _ g (כלב)', answer: 'o' },
            { prompt: '☀️ s _ n (שמש)', answer: 'u' }
        ];
        const allVowels = ['a', 'e', 'i', 'o', 'u'];
        let qIdx = 0;

        function shuffle(array) { return [...array].sort(() => Math.random() - 0.5); }

        function setLevel(lvl) {
            currentLvl = lvl;
            document.querySelectorAll('.lvl-btn').forEach((b, idx) => b.classList.toggle('active', idx + 1 === lvl));
            qIdx = 0;
            renderQuestion();
        }

        function renderQuestion() {
            const card = document.getElementById('quizCard');
            const q = questions[qIdx];
            if (currentLvl === 1) {
                const wrongChoices = allVowels.filter(v => v !== q.answer);
                const options = shuffle([q.answer, ...shuffle(wrongChoices).slice(0, 3)]);
                card.innerHTML = `
                    <div class="prompt-text">${q.prompt}</div>
                    <div class="grid">
                        ${options.map(opt => `<button class="opt-btn" onclick="checkMC(this, '${opt}', '${q.answer}')">${opt}</button>`).join('')}
                    </div>
                `;
            } else if (currentLvl === 2) {
                card.innerHTML = `
                    <div class="prompt-text">${q.prompt}</div>
                    <input type="text" id="typeInput" class="input-box" placeholder="הקלד את התנועה (a,e,i,o,u)..." />
                    <br>
                    <button class="action-btn" onclick="checkTyping('${q.answer}')">בדוק תשובה</button>
                `;
            } else if (currentLvl === 3) {
                card.innerHTML = `
                    <div class="paper-card">
                        <h3>✏️ קח עט ומחברת!</h3>
                        <p>השלם וכתוב את המילה המלאה על הנייר:</p>
                        <h2 style="color:#0284c7; margin:10px 0;">${q.prompt}</h2>
                        <div class="line-guide">${q.prompt.replace('_', q.answer).split(' ')[0]}</div>
                    </div>
                    <p style="font-weight:700; color:#334155; margin-bottom:10px;">הרם את הדף למצלמה שהמורה יראה!</p>
                    <button class="action-btn" onclick="nextQuestion()">המורה אישר! 🌟</button>
                `;
            }
        }

        function checkMC(btn, selected, correct) {
            if (selected === correct) {
                btn.classList.add('correct');
                confetti({ particleCount: 50, spread: 60 });
                setTimeout(nextQuestion, 1200);
            } else {
                btn.classList.add('wrong');
            }
        }

        function checkTyping(correct) {
            const input = document.getElementById('typeInput').value.trim();
            if (input.toLowerCase() === correct.toLowerCase()) {
                confetti({ particleCount: 50, spread: 60 });
                setTimeout(nextQuestion, 1000);
            } else {
                alert('נסה שוב! רמז: התנועה הנכונה היא ' + correct);
            }
        }

        function nextQuestion() {
            qIdx = (qIdx + 1) % questions.length;
            renderQuestion();
        }

        renderQuestion();
    </script>
</body>
</html>
